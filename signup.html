<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camel Wallet - Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <p class="sub-header">Register for Camel Wallet</p>
    <form onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label>Common Name</label>
        <input type="text" id="commonName" required placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" id="country" required placeholder="Ghana">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" required placeholder="0500000000">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required>
      </div>
      <div class="form-group">
        <label>Pin (4 Digits)</label>
        <input type="password" id="pin" maxlength="4" required>
      </div>
      <div class="form-group">
        <label>Confirm Pin</label>
        <input type="password" id="confirmPin" maxlength="4" required>
      </div>
      <button type="submit" class="btn-submit">Sign Up</button>
    </form>
    <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
      Already have an account? <a href="login.html" style="color: var(--accent-green); font-weight: bold;">Log In</a>
    </p>
  </div>
  <script src="conn.js"></script>
</body>
</html>
