<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camel Wallet - Deposit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Deposit</h2>
    <p class="sub-header">Add money to your wallet</p>
    <form onsubmit="handleDeposit(event)">
      <div class="form-group">
        <label>Deposit Option</label>
        <select id="option" required>
          <option value="">Choose an option</option>
          <option value="MTN MoMo">MTN MoMo</option>
          <option value="Telecel Cash">Telecel Cash</option>
          <option value="AirtelTigo Money">AirtelTigo Money</option>
          <option value="Bank">Bank</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (GHS)</label>
        <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00">
      </div>
      <button type="submit" class="btn-submit" disabled
              style="opacity: 0.45; cursor: not-allowed;">Deposit</button>
    </form>
    <a href="dashboard.html" class="nav-btn"
       style="display: block; text-align: center; margin-top: 15px;">Return to Dashboard</a>
  </div>
  <script src="conn.js"></script>
  <script>document.addEventListener('DOMContentLoaded', requireLogin);</script>
</body>
</html>
