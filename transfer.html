<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camel Wallet - Transfer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Transfer Money</h2>
    <p class="sub-header">Send money from your wallet</p>
    <form onsubmit="handleTransfer(event)">
      <div class="form-group">
        <label>Transfer Option</label>
        <select id="option" required>
          <option value="">Choose an option</option>
          <option value="Camel Wallet">Camel Wallet</option>
          <option value="MTN MoMo">MTN MoMo</option>
          <option value="Telecel Cash">Telecel Cash</option>
          <option value="AirtelTigo Money">AirtelTigo Money</option>
        </select>
      </div>
      <div class="form-group">
        <label>Recipient Phone Number</label>
        <input type="text" id="recipient" required placeholder="0500000000">
      </div>
      <div class="form-group">
        <label>Amount (GHS)</label>
        <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Your Pin</label>
        <input type="password" id="pin" maxlength="4" required>
      </div>
      <button type="submit" class="btn-submit">Send Money</button>
    </form>
    <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
      <a href="dashboard.html" style="color: var(--accent-green); font-weight: bold;">Back to Dashboard</a>
    </p>
  </div>
  <script src="conn.js"></script>
  <script>document.addEventListener('DOMContentLoaded', requireLogin);</script>
</body>
</html>
